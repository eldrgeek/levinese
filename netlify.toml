[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# /papers → /corpus (301 — canonical URL is /corpus now)
# Anchors (#slug) pass through automatically.
# Feedback chip, central host (soma-chip repo), proxied so it stays same-origin.
# Must come before any SPA fallback. vendor/soma-feedback/soma-chip-loader.js falls
# back to the vendored chip when this answers badly or slowly. (bead pm-8e8a)
[[redirects]]
  from = "/soma-chip/*"
  to = "https://soma-chip.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/papers"
  to = "/corpus"
  status = 301

[[redirects]]
  from = "/papers/"
  to = "/corpus/"
  status = 301

[[redirects]]
  from = "/papers/*"
  to = "/corpus/:splat"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# GENERATED by sites/_shared/host/build-hosts.mjs — AI host (see sites/_shared/host/)
[[edge_functions]]
  path = "/api/ask"
  function = "ask"
